# gatekeeper — Authum module config (no secrets in git)
# Copy to modules/gatekeeper/ and set iphub_api_key locally
# (or use gatekeeper.local.cfg — gitignored).

# sqlite (default) | mysql (Authum dlopen — needs libmariadb/libmysqlclient on host)
sql_driver = sqlite
sql_path = gatekeeper.sqlite
sql_table_ip = user
sql_table_client = client

# MySQL (when sql_driver = mysql); put sql_pass in gatekeeper.local.cfg
# sql_host = 127.0.0.1
# sql_user = root
# sql_pass =
# sql_db = gatekeeper
# sql_port = 3306

iphub_enabled = 1
iphub_timeout_ms = 3000
# iphub_api_key =   # set locally — never commit

filter_enabled = 1
filter_debug = 0
# Kick when IPHub block > filter_block_max (AMXX gatekeeper_filter_block)
filter_block_max = 0
filter_allow_countries = 1
filter_countries = RU BY UA KZ KG MD UZ LV LT EE GE RO AM BG AZ TM TJ
filter_kick_reason = Access denied
filter_whitelist = whitelist.ini

logging_mode = 6
logging_split = full
