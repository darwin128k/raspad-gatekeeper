# gatekeeper — Authum module config (no secrets in git)
# Copy to modules/gatekeeper/ and set IphubApiKey locally (or use gatekeeper.local.cfg — gitignored).

# sqlite (default) | mysql (Authum dlopen — needs libmariadb/libmysqlclient on host)
SqlDriver = sqlite
SqlPath = gatekeeper.sqlite
SqlTableIp = user
SqlTableClient = client

# MySQL (when SqlDriver = mysql); put SqlPass in gatekeeper.local.cfg
# SqlHost = 127.0.0.1
# SqlUser = root
# SqlPass =
# SqlDb = gatekeeper
# SqlPort = 3306

IphubEnabled = 1
IphubTimeoutMs = 3000
# IphubApiKey =   # set locally — never commit

FilterEnabled = 1
FilterDebug = 0
# Kick when IPHub block > FilterBlockMax (AMXX gatekeeper_filter_block)
FilterBlockMax = 0
FilterAllowCountries = 1
FilterCountries = RU BY UA KZ KG MD UZ LV LT EE GE RO AM BG AZ TM TJ
FilterKickReason = Access denied
FilterWhitelist = whitelist.ini

LoggingMode = 6
LoggingSplit = full
